# Place at: .github/workflows/arm64.yml in YOUR FORK of Kryoto-Dev/kryoto-desktop.
# Run from the Actions tab ("Run workflow"). Output: a Linux arm64 build of Kryoto Desktop.
# UNTESTED: the first run will likely fail somewhere (sibling repo paths, a wasm step,
# a missing system package). Paste the red error lines back and we fix them one by one.
name: Linux arm64 build

on:
  workflow_dispatch:

jobs:
  build:
    # GitHub's free arm64 runner (free for public repos, which a fork of this one is).
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: kryoto-desktop
    steps:
      # The README wants the three repos side by side.
      # Compare these directory names with the README and adjust if they differ.
      - uses: actions/checkout@v4
        with:
          path: kryoto-desktop
      - uses: actions/checkout@v4
        with:
          repository: Kryoto-Dev/kryoto-messaging
          path: kryoto-messaging
      - uses: actions/checkout@v4
        with:
          repository: Kryoto-Dev/kryoto-padmap
          path: kryoto-padmap

      - name: System packages (standard Tauri 2 Linux dependencies)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl make curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kryoto-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kryoto-desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kryoto-desktop/src-tauri

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # --no-bundle: build only the program. Skips AppImage/.deb packaging and the
      # updater signing, which would need Kryoto's private signing key.
      - name: Build (no installer)
        run: pnpm exec tauri build --no-bundle

      - name: Collect the program
        run: |
          mkdir -p out
          find src-tauri/target/release -maxdepth 1 -type f -perm -u+x \
            ! -name '*.so' ! -name '*.d' -exec cp {} out/ \;
          ls -la out
          file out/* | head
          tar czf kryoto-desktop-linux-arm64.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: kryoto-desktop-linux-arm64
          path: kryoto-desktop/kryoto-desktop-linux-arm64.tar.gz
